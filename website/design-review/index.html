<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f3f2"><title>物理学先驱档案</title>
  <link rel="icon" href="../dist/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="review.css">
  <script defer src="../dist/data/archive.js"></script><script defer src="../dist/core.js"></script>
  <script defer src="timeline.js"></script><script defer src="scroll-sync.js"></script><script defer src="breakthrough.js"></script>
  <script defer src="density-palette.js"></script>
  <script defer src="plot-display.js"></script>
  <script defer src="data/breakthrough-data.js"></script><script defer src="review.js"></script>
</head>
<body>
<a class="skip" href="#people-list" data-label="skip">跳到人物列表</a>
<div class="workspace" data-scroll-driver="list">
  <aside class="sidebar">
    <a class="wordmark" href="#" id="reset-all"><span class="mark" aria-hidden="true">φ</span><strong data-label="brand">物理学先驱</strong></a>
    <div class="axis-header"><button id="index-method" class="index-title" data-label="indexTitle">物理学突破指数</button><span class="info-dot" aria-hidden="true">i</span></div>
    <button class="axis-year" id="year-detail" title="年度成果"><span id="axis-year">—</span><span aria-hidden="true">↗</span></button>
    <div class="axis-wrap" id="axis-wrap" role="slider" tabindex="0" aria-orientation="vertical"><svg id="time-axis" aria-hidden="true"></svg><div id="axis-tooltip" class="axis-tooltip" hidden></div></div>
    <label class="smooth-control"><span data-label="smoothing">平滑</span><input id="plot-smoothing" type="range" min="0" max="6" step="0.5" value="2.5"><output id="smoothing-value">2.5</output></label>
    <div class="color-key"><div class="color-key-title"><span data-label="density">贡献人物密度</span><span id="density-unit"></span></div><svg id="density-scale" role="img"></svg></div>
    <div class="reading"><span data-label="reading">贡献年代</span><strong id="reading-range">—</strong></div>
    <p class="axis-foot" data-label="axisFoot">贡献年代 · 自适应时间分辨率</p>
  </aside>
  <main class="main-pane">
    <header class="page-header"><div><p class="eyebrow" data-label="eyebrow">PHYSICS · HISTORY · PEOPLE</p><h1 data-label="title">物理学先驱档案</h1><p id="archive-subtitle"></p></div><div class="language" aria-label="Language"><button data-language="zh" aria-pressed="true">中</button><button data-language="en" aria-pressed="false">EN</button></div></header>
    <div class="filter-bar"><div class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.7" cy="10.7" r="6.6"/><path d="m16 16 4 4"/></svg><label class="sr-only" for="query" data-label="search">搜索姓名或研究领域</label><input id="query" type="search" autocomplete="off" spellcheck="false"><button id="clear-query" hidden>×</button><kbd>/</kbd></div><label class="field-select"><span class="sr-only" data-label="field">研究领域</span><select id="field"></select></label></div>
    <div class="archive-body">
      <div class="list-pane"><div class="list-summary"><span id="result-status" role="status" aria-live="polite"></span></div><div class="column-labels" aria-hidden="true"><span data-label="contributionYear">贡献年</span><span data-label="person">人物</span><span data-label="field">研究领域</span><span></span></div><section id="list-scroll" class="list-scroll"><div id="people-list"></div><div id="empty" class="empty" hidden><h2 data-label="noResults">没有匹配的人物</h2><p data-label="noResultsHint">尝试其他姓名或研究领域。</p></div></section></div>
      <aside class="preview-rail"><div class="year-card" id="year-card"></div></aside>
    </div>
    <footer class="pane-footer"><span id="coverage-status"></span><span id="archive-date"></span></footer>
  </main>
</div>
<dialog class="dossier" id="dossier" aria-labelledby="dossier-name"><div class="sheet-toolbar"><span data-label="dossier">人物档案</span><div><button id="sheet-language" class="sheet-language">English</button><button id="close-dossier" class="close">×</button></div></div><div id="sheet-content" class="sheet-scroll"></div></dialog>
<dialog class="insight" id="insight" aria-labelledby="insight-title"><div class="sheet-toolbar"><span id="insight-toolbar"></span><button id="close-insight" class="close">×</button></div><div id="insight-content" class="sheet-scroll"></div></dialog>
<noscript>请启用JavaScript以查看档案。Please enable JavaScript.</noscript>
</body></html>
