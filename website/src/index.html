<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="沿时间轴探索721位物理学先驱的生平、贡献与历史档案。Search and explore the lives of physics pioneers in Chinese and English.">
  <title>物理学先驱档案 · Physics Pioneers</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script defer src="data/archive.js"></script>
  <script defer src="core.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <a class="skip-link" href="#archive" data-i18n="skip">跳到人物时间轴</a>
  <header class="site-header">
    <div class="header-inner">
      <button class="brand" id="home-button" type="button" aria-label="物理学先驱档案首页">
        <span><strong data-i18n="brand">物理学先驱</strong><small>PHYSICS PIONEERS</small></span>
      </button>
      <nav class="header-nav" aria-label="主导航">
        <a class="nav-link active" href="#archive" id="timeline-nav" data-i18n="timeline">人物时间轴</a>
        <button class="nav-link" type="button" data-about data-i18n="about">关于档案</button>
      </nav>
      <div class="language-switch" aria-label="Language">
        <button type="button" data-lang="zh" aria-pressed="true" lang="zh-CN">中文</button>
        <button type="button" data-lang="en" aria-pressed="false" lang="en">EN</button>
      </div>
    </div>
  </header>

  <main>
    <section class="hero page-width" aria-labelledby="hero-title">
      <div class="hero-copy">
        <h1 id="hero-title" data-i18n="heroTitle">物理学先驱档案</h1>
        <p class="hero-description" id="hero-description"></p>
        <div class="hero-facts"><span><strong id="total-count">721</strong><span data-i18n="people">位探索者</span></span><span class="fact-divider"></span><span data-i18n="spanYears">跨越两千六百年</span><span class="fact-divider"></span><span data-i18n="twoLanguages">中英双语档案</span></div>
      </div>

    </section>

    <section class="archive page-width" id="archive" aria-labelledby="archive-heading">
      <div class="archive-heading-row">
        <div><h2 id="archive-heading" data-i18n="timeline">人物时间轴</h2></div>
        <p class="chronology-note" data-i18n="chronology">按出生时间，从早到晚</p>
      </div>
      <div class="browse-controls">
        <div class="search-control">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"></circle><path d="m16 16 4.5 4.5"></path></svg>
          <label class="sr-only" for="search-input" data-i18n="searchLabel">搜索姓名或研究领域</label>
          <input type="search" id="search-input" autocomplete="off" spellcheck="false" placeholder="搜索姓名或研究领域，如：爱因斯坦、量子力学…">
          <button class="search-clear icon-button" id="clear-search" type="button" hidden aria-label="清空搜索">×</button>
          <kbd aria-hidden="true">/</kbd>
        </div>
        <div class="field-control"><label for="field-select" data-i18n="fieldLabel">研究领域</label><select id="field-select"></select></div>
        <div class="mobile-era-control"><label class="sr-only" for="era-select" data-i18n="eraLabel">选择年代</label><select id="era-select"></select></div>
      </div>
      <div class="archive-layout">
        <aside class="era-sidebar" aria-labelledby="era-heading">
          <h3 id="era-heading" data-i18n="eraLabel">探索年代</h3>
          <nav class="era-nav" id="era-nav" aria-label="年代筛选"></nav>
        </aside>
        <div class="results-area">
          <div class="results-toolbar"><p id="results-status" role="status" aria-live="polite" aria-atomic="true"></p><button type="button" id="reset-filters" class="text-button" hidden data-i18n="reset">重置筛选</button></div>
          <div id="timeline-results" class="timeline-results"></div>
          <div class="empty-state" id="empty-state" hidden><span aria-hidden="true">⌕</span><h3 data-i18n="noResults">没有找到相关人物</h3><p data-i18n="noResultsHint">试试中文名、英文名或更宽泛的研究领域。</p><button type="button" class="primary-button" id="empty-reset" data-i18n="reset">重置筛选</button></div>
          <div class="load-more-wrap" id="load-more-wrap" hidden><p id="load-progress"></p><button type="button" class="load-more" id="load-more"><span data-i18n="loadMore">继续沿时间轴探索</span><span aria-hidden="true">↓</span></button></div>
          <p class="end-note" id="end-note" hidden data-i18n="endNote">已到达这段时间轴的末端。探索还在继续。</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer page-width"><div class="footer-title"><span data-i18n="fullBrand">物理学先驱档案</span></div><p id="footer-note"></p><button class="text-button" type="button" data-about data-i18n="about">关于档案</button></footer>
  <button id="back-to-top" class="back-to-top" type="button" hidden aria-label="返回顶部">↑</button>

  <dialog class="profile-dialog" id="profile-dialog" aria-labelledby="profile-name">
    <div class="dialog-toolbar"><span class="eyebrow" data-i18n="dossier">人物档案</span><div class="dialog-actions"><div class="language-switch" aria-label="Language"><button type="button" data-lang="zh" aria-pressed="true" lang="zh-CN">中文</button><button type="button" data-lang="en" aria-pressed="false" lang="en">EN</button></div><button class="close-button icon-button" id="close-profile" type="button" aria-label="关闭档案">×</button></div></div>
    <div class="profile-scroll" id="profile-scroll"><div id="profile-content"></div></div>
  </dialog>
  <dialog class="about-dialog" id="about-dialog" aria-labelledby="about-title"><div class="dialog-toolbar"><span class="eyebrow">ABOUT THE ARCHIVE</span><button class="close-button icon-button" id="close-about" type="button" aria-label="关闭">×</button></div><div id="about-content"></div></dialog>
  <noscript><div class="noscript-note">请启用JavaScript以浏览人物时间轴与双语档案。Please enable JavaScript to explore the archive.</div></noscript>
</body>
</html>
